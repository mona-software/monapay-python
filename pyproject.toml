[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "monapay"
version = "0.5.1"
description = "SDK Python zero-dependency cho MONA Pay"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "The MONA Group", email = "info@themona.global" }]
keywords = ["monapay", "vietqr", "virtual-account", "payment", "webhook", "email"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
]

[project.urls]
Documentation = "https://monapay.vn/docs"
Repository = "https://github.com/monapay/monapay-python"

[tool.setuptools.packages.find]
include = ["monapay*"]
